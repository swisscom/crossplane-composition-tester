apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xs3buckets.aws.storage.example.com
spec:
  group: storage.example.com
  names:
    kind: XS3Bucket
    plural: xs3buckets
  claimNames:
    kind: S3Bucket
    plural: s3buckets
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              bucketName:
                type: string
                description: Name of the S3 bucket
              encryption:
                type: boolean
                description: Enable encryption
                default: true
              versioning:
                type: boolean
                description: Enable versioning
                default: false
              tags:
                type: object
                additionalProperties:
                  type: string
                description: Tags for the bucket
              lifecycleRules:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    enabled:
                      type: boolean
                    expirationDays:
                      type: integer
            required:
            - bucketName
